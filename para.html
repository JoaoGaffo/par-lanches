<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="style.css"> <!-- Corrigido aqui -->
</head>
<body>

    <div class="form-container">
        <div class="form-container">
    <header>Pará lanches</header>
    <form>

            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço" required> <!-- type="text" -->
            </div>

            <div class="input-group">
                <label for="Pedido">Pedido</label>
                <select id="Pedido" name="Pedido">
                    <option value="">Selecione uma opção</option>
                    <option value="queijo">Pão de queijo</option>
                    <option value="cafe">Café preto</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="termos" name="termos">
                <label for="termos">Aceito os termos e condições</label>
            </div>

            <button type="submit">Enviar Dados</button>
        </form>
    </div>

</body>
</html>
